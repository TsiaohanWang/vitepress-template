name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: `lastUpdated: true` derives timestamps from git log.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Typst packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst/packages
          key: typst-packages-v1

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Hard-fail on broken icon syntax (warnings are not enough in CI);
      # Typst fences already fail soft by design, their errors surface in logs.
      - run: ICONIFY_STRICT=1 pnpm docs:build
